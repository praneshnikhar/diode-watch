name: diode-watch

services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly no
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: diode
      POSTGRES_USER: diode
      POSTGRES_PASSWORD: diode
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diode -d diode"]
      interval: 5s
      timeout: 3s
      retries: 10

  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://diode:diode@db:5432/diode
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/diode-alert
      WARMUP_SIM_SECONDS: "180"
      THROUGHPUT_TARGET: "2000"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    ports:
      - "9100:9100"

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      SPEED: "4"
      FLOWS_PER_SEC: "800"
      SCENARIO_SEED: "42"
    depends_on:
      redis:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: dashboard/backend/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://diode:diode@db:5432/diode
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: dashboard/frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_BASIC_AUTH_ACTIVE: "false"
      N8N_HOST: n8n
      GENERIC_TIMEZONE: UTC
      SLACK_WEBHOOK: ${SLACK_WEBHOOK:-}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - engine
      - api

  grafana:
    image: grafana/grafana:latest
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: diode
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  db_data:
  n8n_data:
  grafana_data:
